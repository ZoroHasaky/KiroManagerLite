name: Release

# 版本由根目录的 VERSION 文件控制。
#
# 触发逻辑：推送包含 VERSION 改动的提交到 main 时自动打包并发布。
# 判断依据是「本次推送的 before..after 之间 VERSION 内容有没有变化」，
# 而不是「文件有没有被碰到」——只改 VERSION 里的数字才算发布，
# 顺带格式化、改注释都不会误触发一次发布。
#
# 也可以在 Actions 页面手动触发（workflow_dispatch）：
#   - 默认只构建，不建 Release，用于验证打包链路；
#   - 勾选 force_release 才真正发布，适合补发或重跑失败的发布。
#
# 注意：本仓库是 fork（上游 lucks-cloud/kiro-manager-lite）。GitHub 默认不在 fork 上
# 自动运行 push 触发的 workflow，需要在 fork 仓库的 Actions 页面点一次
# 「I understand my workflows, go ahead and enable them」才会生效。
# 启用之后上述 push 触发与手动触发都能正常跑；在此之前推送不会有任何 run。
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: '真正发布（创建 Release 并上传安装包）'
        type: boolean
        default: false

# 同一分支的连续推送只保留最后一次：VERSION 连改两次时，
# 前一次构建中的产物已经过期，没必要再跑完。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先判断这次要不要发布，后续 job 用它决定是否继续。
  # 单独做成一个 job 而不是在 build 里用 if：needs 里多个 job 的条件写起来更清楚，
  # 且 build 被跳过时 release 不会因为「needs 被跳过」而误判。
  detect:
    name: 检测版本变化
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.detect.outputs.release }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 要读 before 提交里的 VERSION。一次推送可能包含多个提交，
          # 只取 2 个的话 before 拿不到、会退化成只比最后一个提交，漏掉前面的版本改动。
          fetch-depth: 0

      - name: 读取 VERSION 并比对
        id: detect
        run: |
          version="$(head -n1 VERSION | tr -d '\r' | xargs)"
          echo "当前 VERSION: $version"

          # 版本号必须是语义化版本，否则打出来的包名和更新检查都会出问题，
          # 这里提前拦住，避免跑到打包阶段才失败
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::VERSION 内容不是合法的语义化版本：'$version'"
            exit 1
          fi

          should=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发时按用户的勾选决定
            if [ "${{ inputs.force_release }}" = "true" ]; then
              should=true
            fi
            echo "手动触发，force_release=${{ inputs.force_release }}"
          else
            # 推送触发：比对这次推送范围内的 VERSION 内容。
            # before 取不到（强推、分支新建）时退回上一个提交。
            if git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
              ref="${{ github.event.before }}"
            else
              ref="HEAD~1"
            fi
            # 拿不到上一个版本有两种情况，都不该当成「版本变了」：
            #   - 上一个提交里根本没有 VERSION（首次引入该文件）；
            #   - ref 本身不存在（仓库只有这一个提交）。
            # 否则刚接入 VERSION 机制的那次提交会立刻发一个与当前版本同号的 Release。
            prev="$(git show "$ref:VERSION" 2>/dev/null | head -n1 | tr -d '\r' | xargs || true)"
            if [ -z "$prev" ]; then
              echo "上一个提交里没有 VERSION（或被取不到），视为首次引入，不触发发布"
              prev="$version"
            fi
            echo "上次 VERSION: $prev"
            if [ "$prev" != "$version" ]; then
              should=true
            fi
          fi

          echo "release=$should" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$should" = "true" ]; then
            echo "→ 将打包 v$version 并发布"
          else
            echo "→ VERSION 未变化，跳过打包"
          fi

  build:
    name: 构建 ${{ matrix.label }}
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # 单平台失败不连累另一个：只重跑失败的那个即可
      fail-fast: false
      matrix:
        include:
          # Windows 包必须在 windows runner 上打：
          # cbor-extract 没有跨平台可用的预编译产物，交叉编译会失败
          - label: Windows x64
            os: windows-latest
            script: build:win
            artifacts: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
          # macOS arm64（Apple Silicon）。只出 dmg + zip，不产 pkg。
          #
          # 不用 macos-latest：它指向 macOS 26 Arm64，容量最紧张，实测排队 15 分钟后
          # 直接被取消（"was not acquired by Runner of type hosted"）。macos-15 同样是
          # arm64，排队明显短。目标只是打 arm64 包，具体是哪个 macOS 大版本无所谓。
          - label: macOS arm64
            os: macos-15
            script: build:mac:arm
            artifacts: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 需 >= 22.19：undici 8 / chalk 6 / electron-store 12 的最低要求
          node-version: 22.19
          cache: npm

      # 兜底：任何依赖触发 node-gyp 时都需要 distutils，
      # runner 自带的 Python 3.12+ 已移除它，靠 setuptools 补回来
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 准备构建工具链
        run: python -m pip install --upgrade setuptools

      - name: 安装依赖
        run: npm ci

      # 提交里的 package.json 版本若与 VERSION 不同，说明改版本时漏了同步。
      # 打包会自动纠正（prepack:dist 先跑同步脚本），所以这里只提示不阻断：
      # continue-on-error 让这一步标红但不中断 job，作者看到就能顺手补上。
      - name: 提示版本文件是否已同步
        continue-on-error: true
        run: npm run version:check

      # --publish never：产物统一交给下面的 release job 上传，
      # 避免 electron-builder 在 CI 里自行创建重复的 Release。
      # macOS 那条走 scripts/build-mac-arm.mjs，脚本内部已经写死 --publish never，
      # 这里再传一次会被 yargs 收成数组导致判定为「要发布」，脚本里已做了滤重。
      - name: 打包
        run: npm run ${{ matrix.script }} -- --publish never

      # 只在 macOS runner 上能跑：校验 .app 的签名是否真的落到了产物里。
      #
      # 之前没配 identity 时 electron-builder 会「完全跳过签名」，而它注入 asar、
      # 改写 Info.plist 之后，包里 Electron 自带的签名必然失效。Intel 上表现为
      # 「无法验证开发者」，Apple Silicon 上直接报「已损坏，无法打开」。
      # codesign --verify 对未签名或签名破损的包会非零退出，让发布在构建阶段就失败，
      # 而不是等用户装完才发现。
      - name: 校验 macOS 签名完整性
        if: runner.os == 'macOS'
        run: |
          app="$(find dist -maxdepth 2 -name '*.app' -type d | head -n1)"
          if [ -z "$app" ]; then
            echo "::error::dist 下没有找到 .app，无法校验签名"
            exit 1
          fi
          echo "校验 $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # 打印实际签名信息便于排查：没配证书时应当是 ad-hoc（Signature=adhoc）
          codesign -dv --verbose=4 "$app" 2>&1 | tee /tmp/codesign.txt
          if grep -q 'Signature=adhoc' /tmp/codesign.txt; then
            echo "签名类型：ad-hoc（未使用开发者证书，符合当前发布方式）"
          elif grep -q 'Authority=Developer ID Application' /tmp/codesign.txt; then
            echo "签名类型：Developer ID 正式签名"
          else
            echo "::error::签名类型不在预期范围内，请检查 mac.identity 配置"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布 Release
    needs: [detect, build]
    # 只要这次要发布，就尝试发布，不要求所有平台都成功。
    #
    # 默认语义是「依赖任一失败就跳过」，那会让「macOS runner 排队超时被取消、但 Windows
    # 已经打好包」的情况变成整个版本发不出去。macOS 的 arm64 runner 容量紧张时很常见。
    # !cancelled() 让本 job 在依赖失败后仍然运行（真正被取消时不跑，免得产出半截版本），
    # 具体缺哪些平台在下面的步骤里判断并写进发布说明。
    if: ${{ !cancelled() && needs.detect.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 没有产物时这个 action 会直接失败，但报错是「Unable to find any artifacts」，
      # 看不出真正原因是某个平台的 runner 没抢到机器。先容错，下一步自己判断并给出清晰原因。
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
          merge-multiple: true

      - name: 检查产物
        id: check
        run: |
          echo "构建结果：${{ needs.build.result }}"
          # 只有文件才算数：download-artifact 可能留下空目录
          files="$(find artifacts -type f 2>/dev/null || true)"
          if [ -z "$files" ]; then
            echo "::error::没有任何平台打包成功（构建结果：${{ needs.build.result }}），不发布空版本"
            exit 1
          fi
          has_win=false; has_mac=false
          printf '%s\n' "$files" | grep -q '\.exe$' && has_win=true || true
          printf '%s\n' "$files" | grep -q '\.dmg$' && has_mac=true || true
          echo "win=$has_win" >> "$GITHUB_OUTPUT"
          echo "mac=$has_mac" >> "$GITHUB_OUTPUT"
          echo "Windows：$has_win，macOS：$has_mac"
          printf '%s\n' "$files"

      - name: 生成发布说明
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          HAS_WIN: ${{ steps.check.outputs.win }}
          HAS_MAC: ${{ steps.check.outputs.mac }}
        run: |
          version="$VERSION"
          # 只取 CHANGELOG 里当前版本那一段，避免把历史日志全塞进说明。
          # 同时跳过底部链接定义，以及每版重复的「安装遇到问题」入口行——
          # 后者统一放到说明最底部（见下方），并用绝对链接，避免夹在下载表上方且无法点击。
          awk -v ver="$version" '
            !flag && index($0, "## [" ver "]") == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { exit }
            flag && $0 ~ /^\[.*\]: http/ { next }
            flag && $0 ~ /^> *安装遇到问题/ { next }
            flag { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "本次发布未在 CHANGELOG.md 中找到 $version 的条目。" > NOTES.md
          fi

          # 下载表按实际产出的平台生成：某个平台的 runner 没抢到机器时，
          # 不该在说明里承诺一个并不存在的安装包。
          {
            echo ''
            echo '## 📦 下载'
            echo ''
            echo '| 平台 | 文件 |'
            echo '| --- | --- |'
            [ "$HAS_WIN" = "true" ] && echo '| Windows (x64) | `*-win-x64-setup.exe` |'
            [ "$HAS_MAC" = "true" ] && echo '| macOS (Apple Silicon) | `*-mac-arm64.dmg` |'
            echo ''
            if [ "$HAS_MAC" != "true" ]; then
              echo '> ⚠️ 本次 macOS 安装包未随版本发布（构建机的 macOS runner 未分配成功），'
              echo '> 需要 macOS 包的请等下次发布，或在该版本对应的 Actions 运行里重跑 macOS 任务。'
              echo ''
            fi
            if [ "$HAS_WIN" != "true" ]; then
              echo '> ⚠️ 本次 Windows 安装包未随版本发布。'
              echo ''
            fi
            if [ "$HAS_MAC" = "true" ]; then
              echo 'macOS 安装包已做 ad-hoc 签名，但未使用 Apple 开发者证书、也未公证，首次打开仍会被'
              echo 'Gatekeeper 拦截一次：在「系统设置 - 隐私与安全性」点「仍要打开」，或在「应用程序」里'
              echo '按住 Control 点击应用后选「打开」。放行一次之后即可正常双击启动。'
              echo ''
            fi
            echo '---'
            echo ''
            echo '> 安装遇到问题？请查看 [安装说明与常见问题](https://github.com/ZoroHasaky/KiroManagerLite/blob/main/INSTALL.md)。'
          } >> NOTES.md
          cat NOTES.md

      - name: 删除同版本旧 Release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              })
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              })
              core.info(`已删除同版本旧 Release：${release.tag_name}`)
            } catch (error) {
              if (error.status !== 404) throw error
              core.info(`未找到 ${tag} 的旧 Release，继续首次发布`)
            }

      - uses: softprops/action-gh-release@v2
        with:
          # tag 用 VERSION 的值：应用内的「检查更新」比对的就是 tag 里的版本号，
          # 两者必须一致，否则用户永远看不到新版本
          tag_name: v${{ needs.detect.outputs.version }}
          name: v${{ needs.detect.outputs.version }}
          body_path: NOTES.md
          files: artifacts/**
          fail_on_unmatched_files: true
